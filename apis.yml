name: NaviStone
description: >-
  NaviStone is a direct-mail marketing technology company that turns first-party
  and "unknown" website audiences into addressable postcard campaigns for consumer
  brands. Its platform helps businesses prospect (lookalike audiences), retain
  (mailing customers who opt out of digital channels), and retarget (postcards that
  amplify campaign performance), claiming up to a 70% increase in return on marketing
  spend. NaviStone's platform API (implemented on the Zazmic platform and published
  at docs.navistone.com) manages clients, website domains, audience segments,
  campaigns tied to Modern Postcard creative IDs, ZIP-code and state geo-targeting,
  and output tracking, all secured with an X-API-Key header. NaviStone is backed by
  Bullpen Capital and works with brands including Sleep Number, Vitamix, and Hey Dude
  across retail, travel, beauty, apparel, and home services.
